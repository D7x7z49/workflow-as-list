# packages/wal-core/pyproject.toml
[project]
name = "d49-wal-core"
version = "0.1.1rc1"
description = "Python parser implementation for D7x7z49/workflow-as-list."
readme = "README.md"
authors = [
    { name = "D7x7z49", email = "85430783+D7x7z49@users.noreply.github.com" }
]
keywords = ["workflow", "agent", "task", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "pydantic>=2.13.3",
]

[project.urls]
Repository = "https://github.com/D7x7z49/workflow-as-list"
Issues = "https://github.com/D7x7z49/workflow-as-list/issues"

[project.scripts]
wal-core = "wal_core:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wal_core"
module-root = "src"
