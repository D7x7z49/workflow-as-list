# pyproject.toml
[project]
name = "workflow-as-list"
version = "0.1.0"
description = "A language to describe agent task workflows with a syntax free from implementation details."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [
    { name = "D7x7z49", email = "85430783+D7x7z49@users.noreply.github.com" }
]
dependencies = []

[project.urls]
Repository = "https://github.com/D7x7z49/workflow-as-list"
Issues = "https://github.com/D7x7z49/workflow-as-list/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
testpaths = ["test"]
python_files = ["*.unit.test.py", "*.component.test.py", "*.integration.test.py", "*.e2e.test.py"]
