# pyproject.toml
[project]
name = "waf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
testpaths = ["test"]
python_files = ["*.unit.test.py", "*.component.test.py", "*.integration.test.py", "*.e2e.test.py"]
